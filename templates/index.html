<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwinCNC - 五轴数控机床仿真系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #2d2d2d;
            --border-color: #3e3e42;
            --text-primary: #cccccc;
            --text-highlight: #ffffff;
            --accent-blue: #007acc;
            --accent-green: #4ec9b0;
            --accent-orange: #ce9178;
            --danger: #f14c4c;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-rows: 45px 1fr 200px; /* 顶栏, 主内容, 底栏 */
            margin: 0;
            padding: 0;
        }

        /* --- 1. 顶部导航栏 --- */
        .industrial-header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            z-index: 1000;
        }

        .brand-area {
            display: flex;
            align-items: center;
            font-weight: 600;
            color: var(--text-highlight);
            font-size: 16px;
        }

        .brand-area i { color: var(--accent-blue); margin-right: 10px; }

        .global-status-bar {
            display: flex;
            gap: 20px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #111;
            padding: 4px 10px;
            border-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .top-controls {
            display: flex;
            gap: 8px;
        }

        .btn-industrial {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 2px;
            transition: all 0.2s;
        }
        .btn-industrial:hover:not(:disabled) { background: #3e3e42; color: #fff; }
        .btn-industrial:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-play { border-color: #2da042; color: #2da042; }
        .btn-play:hover { background: #2da042; color: #fff; }
        .btn-stop { border-color: var(--danger); color: var(--danger); }
        .btn-stop:hover { background: var(--danger); color: #fff; }

        /* --- 2. 主布局网格 --- */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr 280px; /* 左侧栏, 中间视口, 右侧栏 */
            overflow: hidden;
            background: var(--bg-dark);
        }

        /* 通用面板样式 */
        .panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel:last-child { border-right: none; border-left: 1px solid var(--border-color); }
        
        .panel-header {
            padding: 8px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        /* --- 3. 左侧：数字显示(DRO)与控制 --- */
        .dro-display {
            background: #000;
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .dro-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding: 4px 0;
        }
        .dro-row:last-child { border-bottom: none; }
        
        .axis-label { color: var(--accent-blue); font-weight: bold; font-size: 1.2em; }
        .axis-value { color: var(--accent-green); font-size: 1.2em; text-align: right; }
        
        .control-group {
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            padding: 10px;
            background: #2b2b2b;
        }

        .control-group label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            display: block;
        }

        .dark-input {
            background: #111;
            border: 1px solid #444;
            color: #eee;
            width: 100%;
            padding: 4px 8px;
            font-size: 12px;
        }
        .dark-input:focus { border-color: var(--accent-blue); outline: none; }

        /* --- 4. 中间：Unity 视口 --- */
        .viewport-area {
            background: #111;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .viewport-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 5px;
        }

        /* 强制 Unity 容器适配 Flex 布局 */
        #unityContainer {
            width: 100% !important;
            height: 100% !important;
            background: #000;
            max-width: none !important;
            max-height: none !important;
            aspect-ratio: auto !important; /* 覆盖旧CSS */
        }
        
        /* 覆盖旧的 aspect ratio 类 */
        #unityContainer.aspect-square, 
        #unityContainer.aspect-16-9 {
            aspect-ratio: auto !important;
        }

        /* --- 5. 底部：日志与终端 --- */
        .bottom-panel {
            border-top: 1px solid var(--border-color);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            display: flex;
            background: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 15px;
            font-size: 11px;
            cursor: pointer;
            border-right: 1px solid var(--border-color);
        }
        .tab-btn.active {
            background: var(--bg-panel);
            color: var(--text-highlight);
            border-top: 2px solid var(--accent-blue);
        }

        .tab-content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        .tab-pane-custom {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 10px;
        }
        .tab-pane-custom.active { display: block; }

        /* 日志样式重写 */
        #logArea {
            height: 100%;
            background: #111;
            font-family: 'Consolas', monospace;
            padding: 5px;
            font-size: 12px;
            border: none;
            color: #ddd;
        }

        /* 树形结构微调 */
        .tree-node { padding: 2px 0; font-size: 12px; }
        .tree-node:hover { color: var(--text-highlight); }
        .tree-children { margin-left: 15px; border-left: 1px solid #444; padding-left: 5px; }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Bootstrap Modal 覆盖 (保持原有 Modal 功能但使其变暗) */
        .modal-content { background-color: #252526; border: 1px solid #444; color: #ccc; }
        .modal-header { border-bottom: 1px solid #444; }
        .modal-footer { border-top: 1px solid #444; }
        .form-control, .form-select { background-color: #333; border: 1px solid #555; color: #eee; }
        .form-control:focus, .form-select:focus { background-color: #333; color: #fff; border-color: var(--accent-blue); box-shadow: none; }
    </style>
</head>
<body>

    <header class="industrial-header">
        <div class="brand-area">
            <i class="fas fa-cube"></i> TwinCNC <span style="font-weight:normal; margin-left:10px; font-size:12px; color:#888;">v2.0 Industrial</span>
        </div>

        <div class="global-status-bar">
            <div class="status-badge" title="服务器连接">
                <i class="fas fa-network-wired"></i>
                <span id="connectionStatus" class="status-indicator status-disconnected"></span>
                <span id="connectionText">未连接</span>
            </div>
            <div class="status-badge" title="仿真状态">
                <i class="fas fa-microchip"></i>
                <span id="simulationStatus" class="status-indicator status-stopped"></span>
                <span id="simulationText">已停止</span>
            </div>
            <div class="status-badge" title="仿真时间">
                <i class="fas fa-clock"></i>
                <span id="simulationTime">0.00 s</span>
            </div>
        </div>

        <div class="top-controls">
            <button id="startBtn" class="btn-industrial btn-play" onclick="startSimulation()">
                <i class="fas fa-play"></i> 启动
            </button>
            <button id="stopBtn" class="btn-industrial btn-stop" onclick="stopSimulation()" disabled>
                <i class="fas fa-stop"></i> 停止
            </button>
            <button class="btn-industrial" onclick="resetSimulation()">
                <i class="fas fa-undo"></i> 重置
            </button>
            <div class="dropdown d-inline-block">
                <button class="btn-industrial dropdown-toggle" type="button" id="menuFile" data-bs-toggle="dropdown">
                    文件
                </button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#" onclick="uploadFMU()">上传 FMU</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showSettings()">设置</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showHelp()">帮助</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="main-layout">
        
        <aside class="panel">
            <div class="panel-header">
                <span><i class="fas fa-tachometer-alt"></i> 数字位置 (DRO)</span>
            </div>
            <div class="panel-content">
                <div class="dro-display">
                    <div class="dro-row">
                        <span class="axis-label">X</span>
                        <span id="xPosition" class="axis-value">0.0000</span>
                    </div>
                    <div class="dro-row">
                        <span class="axis-label">Y</span>
                        <span id="yPosition" class="axis-value">0.0000</span>
                    </div>
                    <div class="dro-row">
                        <span class="axis-label">Z</span>
                        <span id="zPosition" class="axis-value">0.0000</span>
                    </div>
                    <div class="dro-row">
                        <span class="axis-label">A</span>
                        <span id="aPosition" class="axis-value">0.0000°</span>
                    </div>
                    <div class="dro-row">
                        <span class="axis-label">C</span>
                        <span id="cPosition" class="axis-value">0.0000°</span>
                    </div>
                </div>

                <div class="panel-header" style="margin: 10px -10px 10px -10px; padding-left:10px;">
                    <span><i class="fas fa-gamepad"></i> 手动控制</span>
                </div>

                <div class="control-group">
                    <label>轴选择 / 目标位置</label>
                    <div class="input-group input-group-sm mb-2">
                        <select class="form-select dark-input" id="axisSelect" style="max-width: 70px;">
                            <option value="X">X</option>
                            <option value="Y">Y</option>
                            <option value="Z">Z</option>
                            <option value="A">A</option>
                            <option value="C">C</option>
                        </select>
                        <input type="number" class="form-control dark-input" id="positionInput" step="0.1" value="0" placeholder="0.00">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-primary w-50" onclick="moveAxis()">移动</button>
                        <button class="btn btn-sm btn-secondary w-50" onclick="stopAxis()">停止</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>仿真倍率: <span id="speedValue">1.0x</span></label>
                    <input type="range" class="form-range" id="speedInput" min="0.1" max="5" step="0.1" value="1">
                    <button class="btn btn-sm btn-outline-secondary w-100 mt-1" onclick="setSpeed()">设定速度</button>
                </div>

                <div class="panel-header" style="margin: 10px -10px 10px -10px; padding-left:10px;">
                    <span><i class="fas fa-tools"></i> 配置管理</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-sm btn-industrial text-start" onclick="showToolManagement()">
                        <i class="fas fa-wrench me-2"></i> 刀具库 (Tools)
                    </button>
                    <button class="btn btn-sm btn-industrial text-start" onclick="showFixtureManagement()">
                        <i class="fas fa-grip-lines me-2"></i> 夹具管理 (Fixtures)
                    </button>
                    <button class="btn btn-sm btn-industrial text-start" onclick="showWorkpieceManagement()">
                        <i class="fas fa-cube me-2"></i> 工件设定 (Workpiece)
                    </button>
                </div>
            </div>
        </aside>

        <main class="viewport-area">
            <div class="viewport-toolbar">
                <div class="btn-group">
                    <button class="btn btn-sm btn-dark opacity-75" onclick="switchCamera(0)" title="主视角"><i class="fas fa-video"></i> 1</button>
                    <button class="btn btn-sm btn-dark opacity-75" onclick="switchCamera(1)" title="俯视"><i class="fas fa-video"></i> 2</button>
                </div>
                <button class="btn btn-sm btn-dark opacity-75" onclick="toggleUnityUI()" title="Toggle UI"><i class="fas fa-eye"></i> UI</button>
                <button class="btn btn-sm btn-dark opacity-75" onclick="toggleUnityFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
            </div>
            
            <div id="unityContainer">
                <div id="unityLoadingBar" class="text-white position-absolute top-50 start-50 translate-middle text-center">
                    <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>Loading 3D Engine...
                </div>
                <canvas id="unity-canvas" style="width: 100%; height: 100%; display: none;"></canvas>
            </div>
        </main>

        <aside class="panel">
            <div class="panel-header">
                <span><i class="fas fa-code-branch"></i> 机床结构树</span>
                <button class="btn btn-xs btn-link text-muted" onclick="toggleSidebar()"><i class="fas fa-sync"></i></button>
            </div>
            <div class="panel-content" id="sidebar"> <div class="machine-parts-tree small">
                    <div class="tree-item">
                        <div class="tree-node" onclick="toggleTreeNode('table-assembly')">
                            <i class="fas fa-caret-right tree-arrow" id="table-assembly-arrow"></i> 
                            <i class="fas fa-table text-info"></i> 工作台组件
                        </div>
                        <div class="tree-children" id="table-assembly" style="display:none;">
                            <div class="tree-node" onclick="highlightPart('TableX')">- X轴平台</div>
                            <div class="tree-node" onclick="highlightPart('TableY')">- Y轴平台</div>
                            <div class="tree-node" onclick="highlightPart('TableC')">- C轴转台</div>
                        </div>
                    </div>
                    <div class="tree-item mt-2">
                        <div class="tree-node" onclick="toggleTreeNode('spindle-assembly')">
                            <i class="fas fa-caret-right tree-arrow" id="spindle-assembly-arrow"></i>
                            <i class="fas fa-cog text-warning"></i> 主轴组件
                        </div>
                        <div class="tree-children" id="spindle-assembly" style="display:none;">
                            <div class="tree-node">- Z轴主轴</div>
                            <div class="tree-node">- A轴摆头</div>
                        </div>
                    </div>
                </div>

                <div class="panel-header mt-3 mx-n2 px-2">
                    <span><i class="fas fa-wave-square"></i> Z轴测试</span>
                </div>
                <div class="mt-2">
                    <label class="small text-muted">速度倍率: <span id="zAxisSpeedValue">10x</span></label>
                    <input type="range" class="form-range" id="zAxisSpeedInput" min="10" max="50" step="1" value="10">
                    <div class="btn-group w-100 mt-2">
                        <button class="btn btn-sm btn-outline-success" onclick="startZAxisSMotion()">S型测试</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="stopZAxisSMotion()">停止</button>
                    </div>
                </div>
                
                <div class="panel-header mt-3 mx-n2 px-2">
                    <span><i class="fas fa-ruler-combined"></i> 坐标系微调</span>
                </div>
                 <div class="mt-2 small">
                    <div class="d-flex justify-content-between"><span>X Off:</span> <span id="correctionXValue">0</span></div>
                    <input type="range" class="form-range" id="correctionX" min="-1" max="1" step="0.01" value="0">
                    <div class="d-flex justify-content-between"><span>Y Off:</span> <span id="correctionYValue">0</span></div>
                    <input type="range" class="form-range" id="correctionY" min="-1" max="1" step="0.01" value="0">
                    <div class="d-flex justify-content-between"><span>Z Off:</span> <span id="correctionZValue">0</span></div>
                    <input type="range" class="form-range" id="correctionZ" min="-1" max="1" step="0.01" value="0">
                    <button class="btn btn-sm btn-secondary w-100 mt-1" onclick="applyCoordinateCorrection()">应用修正</button>
                </div>

            </div>
        </aside>
    </div>

    <footer class="bottom-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchBottomTab('log')">系统日志</button>
            <button class="tab-btn" onclick="switchBottomTab('travel')">行程测试</button>
            <button class="tab-btn" onclick="switchBottomTab('external')">外部数据源</button>
            <button class="tab-btn" onclick="switchBottomTab('db')">数据库</button>
            <button class="tab-btn" onclick="switchBottomTab('fmu')">FMU 文件</button>
            <div style="flex:1"></div>
            <button class="tab-btn" onclick="clearLog()"><i class="fas fa-trash"></i> 清空日志</button>
        </div>

        <div class="tab-content-area">
            <div id="tab-log" class="tab-pane-custom active">
                <div id="logArea"></div>
            </div>

            <div id="tab-fmu" class="tab-pane-custom">
                <div class="container-fluid">
                     <form id="fmuUploadForm" enctype="multipart/form-data" class="d-flex gap-3 align-items-end">
                        <div class="flex-grow-1">
                            <label class="form-label text-muted small">选择FMU文件</label>
                            <input type="file" class="form-control form-control-sm dark-input" id="fmuFile" name="fmu_file" accept=".fmu">
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-upload"></i> 上传并加载</button>
                    </form>
                    <div id="modelInfo" class="mt-2 text-info small"></div>
                </div>
            </div>

            <div id="tab-travel" class="tab-pane-custom">
                <div class="row g-2">
                    <div class="col-md-2">
                        <button id="startTravelTestBtn" class="btn btn-sm btn-primary w-100" onclick="startTravelTest()">开始测试</button>
                        <button id="stopTravelTestBtn" class="btn btn-sm btn-danger w-100 mt-2" onclick="stopTravelTest()" style="display:none;">停止</button>
                    </div>
                    <div class="col-md-10">
                         <div class="d-flex gap-2 mb-2 flex-wrap">
                             <input type="number" class="dark-input" style="width:80px" id="travelXPos" value="100" placeholder="X+">
                             <input type="number" class="dark-input" style="width:80px" id="travelXNeg" value="-100" placeholder="X-">
                             <input type="number" class="dark-input" style="width:80px" id="travelYPos" value="100" placeholder="Y+">
                             <input type="number" class="dark-input" style="width:80px" id="travelYNeg" value="-100" placeholder="Y-">
                             <input type="number" class="dark-input" style="width:80px" id="travelZPos" value="100" placeholder="Z+">
                             <input type="number" class="dark-input" style="width:80px" id="travelZNeg" value="-100" placeholder="Z-">
                             <input type="number" class="dark-input" style="width:80px" id="travelDelay" value="3" placeholder="Delay(s)">
                             </div>
                         <div id="travelTestStatus" style="display:none;">
                            <div class="progress" style="height: 5px; background:#333;">
                                <div id="travelProgressBar" class="progress-bar bg-success" style="width: 0%"></div>
                            </div>
                            <small id="travelTestInfo" class="text-muted"></small>
                         </div>
                    </div>
                </div>
            </div>

            <div id="tab-external" class="tab-pane-custom">
                <div class="d-flex align-items-center gap-2">
                    <span id="externalWsIndicator" class="status-indicator status-disconnected"></span>
                    <input type="text" class="form-control form-control-sm dark-input" id="externalWsUrl" placeholder="ws://localhost:5000/external" style="width: 300px;">
                    <button id="externalConnectBtn" class="btn btn-sm btn-outline-success">连接</button>
                    <button id="externalDisconnectBtn" class="btn btn-sm btn-outline-secondary">断开</button>
                </div>
            </div>

            <div id="tab-db" class="tab-pane-custom">
                <button id="dbRefreshBtn" class="btn btn-sm btn-outline-primary mb-2">刷新数据</button>
                <div class="row">
                    <div class="col-6">
                        <div id="dbCurrentPositions" class="small text-muted"></div>
                    </div>
                    <div class="col-6">
                        <table class="table table-dark table-sm table-striped" style="font-size:11px;">
                            <tbody id="dbSessionsTable"></tbody>
                        </table>
                        <div id="dbSessionStatsCard" style="display:none;">
                             <div id="dbSessionStats" class="small text-info"></div>
                             <button id="dbCloseStatsBtn" class="btn btn-xs btn-link">关闭统计</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <div class="modal fade" id="toolManagementModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">刀具管理</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                     <select class="form-select mb-3" id="toolSelect" onchange="switchToolWithDebug(this.value)">
                        <option value="1">刀具1 (平底)</option>
                        <option value="2">刀具2 (球头)</option>
                        <option value="3">刀具3 (钻头)</option>
                    </select>
                    <div id="toolModelPreview" class="border rounded p-3 text-center bg-dark"></div>
                    <button class="btn btn-primary w-100 mt-3" onclick="switchToNextTool()">切换下一把</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="fixtureManagementModal" tabindex="-1" aria-hidden="true">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='unity/Build/Build/Build.loader.js') }}"></script>
    <script src="{{ url_for('static', filename='unity_integration.js') }}"></script>

    <script>
        // 底部 Tab 切换逻辑
        function switchBottomTab(tabName) {
            // 移除所有 active 类
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane-custom').forEach(pane => pane.classList.remove('active'));
            
            // 激活当前选中的
            const targetPane = document.getElementById('tab-' + tabName);
            if(targetPane) {
                targetPane.classList.add('active');
                // 找到触发此函数的按钮（简单处理：遍历所有按钮，如果onclick包含tabName则激活）
                const btns = document.querySelectorAll('.tab-btn');
                btns.forEach(btn => {
                    if(btn.getAttribute('onclick').includes(tabName)) {
                        btn.classList.add('active');
                    }
                });
            }
        }

        // 兼容原有的 Sidebar Toggle 逻辑 (虽然现在布局变了，但保留函数防止报错)
        function toggleSidebar() {
            // 简单的折叠逻辑，适配新布局
            const mainLayout = document.querySelector('.main-layout');
            const sidebar = document.getElementById('sidebar').parentElement;
            
            if (sidebar.style.display === 'none') {
                sidebar.style.display = 'flex';
                mainLayout.style.gridTemplateColumns = '300px 1fr 280px';
            } else {
                sidebar.style.display = 'none';
                mainLayout.style.gridTemplateColumns = '300px 1fr 0';
            }
        }

        // 补丁：打开 Modal 的辅助函数 (原代码中直接使用了 new bootstrap.Modal)
        // 这里重新定义一遍以确保新HTML结构能正常触发
        function showToolManagement() {
            const el = document.getElementById('toolManagementModal');
            const modal = new bootstrap.Modal(el);
            modal.show();
            // 触发原有逻辑
            const toolSelect = document.getElementById('toolSelect');
            if (toolSelect && window.updateToolModelPreview) {
                updateToolModelPreview(parseInt(toolSelect.value));
            }
        }

        function showFixtureManagement() {
            new bootstrap.Modal(document.getElementById('fixtureManagementModal')).show();
        }

        function showWorkpieceManagement() {
             new bootstrap.Modal(document.getElementById('workpieceManagementModal')).show();
        }

        function showHelp() { alert("TwinCNC v2.0\n工业仿真系统帮助文档"); }
        function showSettings() { alert("系统设置\n(功能开发中)"); }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 默认激活日志 Tab
            switchBottomTab('log');
        });
    </script>

</html>
