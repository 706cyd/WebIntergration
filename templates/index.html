<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五轴数控机床仿真器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-running { background-color: #007bff; }
        .status-stopped { background-color: #6c757d; }
        
        .axis-control {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .position-display {
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            font-weight: bold;
            color: #007bff;
        }
        
        .variable-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 5px;
        }
        
        .log-area {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 4px;
        }
        /* Unity WebGL 居中与比例控制 */
        .unity-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #unityContainer {
            width: min(92vw, 1200px);
            max-height: 82vh;
            background: #2c2c2c;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
        }
        #unityContainer.aspect-square { aspect-ratio: 1 / 1; }
        #unityContainer.aspect-16-9 { aspect-ratio: 16 / 9; }
        #unityContainer .unity-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 标题栏 -->
            <div class="col-12">
                <nav class="navbar navbar-dark bg-dark">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">
                            <i class="fas fa-cogs"></i> 五轴数控机床仿真器
                        </span>
                        <div class="d-flex">
                            <span class="text-light me-3">
                                连接状态: <span id="connectionStatus" class="status-indicator status-disconnected"></span>
                                <span id="connectionText">未连接</span>
                            </span>
                            <span class="text-light">
                                仿真状态: <span id="simulationStatus" class="status-indicator status-stopped"></span>
                                <span id="simulationText">已停止</span>
                            </span>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        
        <div class="row mt-3">
            <!-- Unity WebGL 3D视图 -->
            <div class="col-12 mb-3">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-cube"></i> 五轴机床3D仿真</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="toggleUnityFullscreen()">
                                <i class="fas fa-expand"></i> 全屏
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="toggleUnityUI()">
                                <i class="fas fa-eye"></i> 切换UI
                            </button>
                            <div class="btn-group ms-2" role="group" aria-label="canvas-aspect">
                                <button class="btn btn-sm btn-outline-secondary" onclick="setUnityAspect('square')">方形</button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="setUnityAspect('16-9')">16:9</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div class="unity-stage">
                            <div id="unityContainer" class="aspect-16-9">
                                <!-- Unity WebGL 内容将在这里加载 -->
                                <div id="unityLoadingBar" class="unity-overlay">
                                    <i class="fas fa-spinner fa-spin"></i> 正在加载3D模型...
                                </div>
                                <canvas id="unity-canvas" style="width: 100%; height: 100%; display: none;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- 左侧面板 - FMU文件和变量信息 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-file-upload"></i> FMU文件管理</h5>
                    </div>
                    <div class="card-body">
                        <form id="fmuUploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="fmuFile" class="form-label">选择FMU文件</label>
                                <input type="file" class="form-control" id="fmuFile" name="fmu_file" accept=".fmu">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload"></i> 上传并加载
                            </button>
                        </form>
                        
                        <div id="modelInfo" class="mt-3" style="display: none;">
                            <h6>模型信息</h6>
                            <div id="modelDetails"></div>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-list"></i> 变量信息</h5>
                    </div>
                    <div class="card-body">
                        <ul class="nav nav-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <a class="nav-link active" id="input-tab" data-bs-toggle="tab" href="#input-variables" role="tab">输入变量</a>
                            </li>
                            <li class="nav-item" role="presentation">
                                <a class="nav-link" id="output-tab" data-bs-toggle="tab" href="#output-variables" role="tab">输出变量</a>
                            </li>
                        </ul>
                        <div class="tab-content mt-2">
                            <div class="tab-pane fade show active" id="input-variables" role="tabpanel">
                                <div id="inputVariablesList" style="max-height: 300px; overflow-y: auto;">
                                    <p class="text-muted">请先加载FMU文件</p>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="output-variables" role="tabpanel">
                                <div id="outputVariablesList" style="max-height: 300px; overflow-y: auto;">
                                    <p class="text-muted">请先加载FMU文件</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 中间面板 - 轴位置显示和控制 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-crosshairs"></i> 轴位置监控</h5>
                    </div>
                    <div class="card-body">
                        <div id="axisPositions">
                            <div class="axis-control">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>X轴:</strong>
                                    <span id="xPosition" class="position-display">0.00 mm</span>
                                </div>
                            </div>
                            <div class="axis-control">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>Y轴:</strong>
                                    <span id="yPosition" class="position-display">0.00 mm</span>
                                </div>
                            </div>
                            <div class="axis-control">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>Z轴:</strong>
                                    <span id="zPosition" class="position-display">0.00 mm</span>
                                </div>
                            </div>
                            <div class="axis-control">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>A轴:</strong>
                                    <span id="aPosition" class="position-display">0.00°</span>
                                </div>
                            </div>
                            <div class="axis-control">
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong>C轴:</strong>
                                    <span id="cPosition" class="position-display">0.00°</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-gamepad"></i> 手动控制</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="axisSelect" class="form-label">选择轴</label>
                                <select class="form-select" id="axisSelect">
                                    <option value="X">X轴</option>
                                    <option value="Y">Y轴</option>
                                    <option value="Z">Z轴</option>
                                    <option value="A">A轴</option>
                                    <option value="C">C轴</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="positionInput" class="form-label">目标位置</label>
                                <input type="number" class="form-control" id="positionInput" step="0.1" value="0">
                            </div>
                        </div>
                        <button class="btn btn-success me-2" onclick="moveAxis()">
                            <i class="fas fa-arrow-right"></i> 移动
                        </button>
                        <button class="btn btn-warning" onclick="stopAxis()">
                            <i class="fas fa-stop"></i> 停止
                        </button>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-6">
                                <label for="speedInput" class="form-label">仿真速度</label>
                                <input type="range" class="form-range" id="speedInput" min="0.1" max="5" step="0.1" value="1">
                                <div class="text-center">
                                    <small id="speedValue">1.0x</small>
                                </div>
                            </div>
                            <div class="col-6 d-flex align-items-end">
                                <button class="btn btn-info me-2" onclick="setSpeed()">
                                    <i class="fas fa-tachometer-alt"></i> 设置速度
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 - 仿真控制和日志 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-play-circle"></i> 仿真控制</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button id="startBtn" class="btn btn-success btn-lg" onclick="startSimulation()">
                                <i class="fas fa-play"></i> 启动仿真
                            </button>
                            <button id="stopBtn" class="btn btn-danger btn-lg" onclick="stopSimulation()" disabled>
                                <i class="fas fa-stop"></i> 停止仿真
                            </button>
                        </div>
                        
                        <div class="mt-3">
                            <strong>仿真时间:</strong> <span id="simulationTime">0.00 s</span>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-database"></i> 数据库概览</h5>
                        <button id="dbRefreshBtn" class="btn btn-sm btn-outline-primary">刷新</button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6 class="text-muted">当前位置 (缓存/实时)</h6>
                            <div id="dbCurrentPositions" class="small">
                                <span class="text-muted">等待数据...</span>
                            </div>
                        </div>

                        <div>
                            <h6 class="text-muted">最近会话</h6>
                            <div class="table-responsive" style="max-height: 220px; overflow-y: auto;">
                                <table class="table table-sm table-striped align-middle">
                                    <thead>
                                        <tr>
                                            <th scope="col">ID</th>
                                            <th scope="col">名称</th>
                                            <th scope="col">状态</th>
                                            <th scope="col">开始时间</th>
                                            <th scope="col">持续(s)</th>
                                            <th scope="col">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dbSessionsTable">
                                        <tr><td colspan="6" class="text-muted">暂无数据</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3" id="dbSessionStatsCard" style="display: none;">
                    <div class="card-header d-flex justify内容-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-chart-line"></i> 会话统计</h5>
                        <button id="dbCloseStatsBtn" class="btn btn-sm btn-outline-secondary">关闭</button>
                    </div>
                    <div class="card-body">
                        <div id="dbSessionStats" class="small"></div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header d-flex justify-content之间 align-items-center">
                        <h5 class="mb-0"><i class="fas fa-network-wired"></i> 外部数据源</h5>
                        <span class="text-muted small">
                            <span id="externalWsIndicator" class="status-indicator status-disconnected"></span>
                            <span id="externalWsText">未连接</span>
                        </span>
                    </div>
                    <div class="card-body">
                        <label for="externalWsUrl" class="form-label">WebSocket地址</label>
                        <div class="input-group mb-2">
                            <input type="text" class="form-control" id="externalWsUrl" placeholder="ws://192.168.1.100:5000/external/positions">
                            <button id="externalConnectBtn" class="btn btn-outline成功" type="button">
                                <i class="fas fa-plug"></i> 连接
                            </button>
                            <button id="externalDisconnectBtn" class="btn btn-outline-secondary" type="button">
                                <i class="fas fa-unlink"></i> 断开
                            </button>
                        </div>
                        <div class="text-muted small">浏览器将连接该地址并转发消息到服务器</div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-terminal"></i> 系统日志</h5>
                    </div>
                    <div class="card-body">
                        <div id="logArea" class="log-area"></div>
                        <button class="btn btn-outline-secondary btn-sm mt-2" onclick="clearLog()">
                            <i class="fas fa-trash"></i> 清除日志
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    
    <!-- Unity WebGL加载脚本 -->
    <script src="{{ url_for('static', filename='unity/Build/Build/Build.loader.js') }}"></script>
    <script src="{{ url_for('static', filename='unity_integration.js') }}"></script>
</body>
</html>
